<!doctype html>
<html lang="fr">
  <body style="margin:0;padding:0;background:#F7F4F1;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#1A1A2E;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F7F4F1;padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#FFFFFF;border:1px solid #EAE5E0;border-radius:20px;padding:36px 32px;">
            <tr>

            <tr>

                <span style="color:#9CA3AF;">Here is your sign-in code.</span>

            </tr>
            <tr>
              <td align="center" style="padding:8px 0 24px;">
                <div style="display:inline-block;background:#F5F2EF;border-radius:14px;padding:16px 28px;font-size:34px;font-weight:700;letter-spacing:10px;color:#1A1A2E;">{{ .Token }}</div>
              </td>
            </tr>
            <tr>
              <td style="font-size:13px;line-height:1.5;color:#9CA3AF;">
                Ce code expire dans 1 heure. Si tu n’as rien demandé, ignore cet email.<br />

              </td>
            </tr>
          </table>
          <p style="font-family:Georgia,serif;font-style:italic;font-size:13px;color:#9CA3AF;margin-top:20px;">Save your inspiration. Plan your moments.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
